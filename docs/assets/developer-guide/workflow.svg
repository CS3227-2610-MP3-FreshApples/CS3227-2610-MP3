<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" role="img" aria-labelledby="title desc"><title id="title">Specification-driven agent workflow</title><desc id="desc">Human gates approve specifications and changes; agents cannot self-approve.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#486176"/></marker></defs><rect width="900" height="715" rx="16" fill="#f5f8fb"/><g font-family="Arial, sans-serif" fill="#17324d"><text x="30" y="38" font-size="25" font-weight="700">Specification-driven agent workflow</text><text x="30" y="67" font-size="16">Human gates approve specifications and changes; agents cannot self-approve.</text><rect x="30" y="100" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="235" y="130" text-anchor="middle" font-size="19" font-weight="700">1. Analyst</text><text x="235" y="159" text-anchor="middle" font-size="16">Scope and acceptance cases</text><rect x="460" y="100" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="665" y="130" text-anchor="middle" font-size="19" font-weight="700">2. Architect</text><text x="665" y="159" text-anchor="middle" font-size="16">Contracts and threats</text><rect x="30" y="220" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="250" text-anchor="middle" font-size="19" font-weight="700">3. Human specification gate</text><text x="450" y="279" text-anchor="middle" font-size="16">Approve recorded decisions before implementation</text><rect x="30" y="340" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="370" text-anchor="middle" font-size="19" font-weight="700">4. Implementation</text><text x="450" y="399" text-anchor="middle" font-size="16">Approved paths and synthetic fixtures</text><rect x="30" y="460" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="235" y="490" text-anchor="middle" font-size="19" font-weight="700">5. Code quality / tests</text><text x="235" y="519" text-anchor="middle" font-size="16">Independent cases and findings</text><rect x="460" y="460" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="665" y="490" text-anchor="middle" font-size="19" font-weight="700">6. Reviewer / tester</text><text x="665" y="519" text-anchor="middle" font-size="16">Intent, security and diff</text><rect x="30" y="580" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="610" text-anchor="middle" font-size="19" font-weight="700">7. Human merge / release gate</text><text x="450" y="639" text-anchor="middle" font-size="16">Resolve findings, cross-review and verify evidence</text><path d="M440 145 L456 145" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M665 190 L450 216" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M450 310 L450 336" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M450 430 L235 456" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M440 505 L456 505" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M665 550 L450 576" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/></g></svg>