<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" role="img" aria-labelledby="title desc"><title id="title">FreshApples system context</title><desc id="desc">Selected topology; production release evidence is incomplete.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#486176"/></marker></defs><rect width="900" height="595" rx="16" fill="#f5f8fb"/><g font-family="Arial, sans-serif" fill="#17324d"><text x="30" y="38" font-size="25" font-weight="700">FreshApples system context</text><text x="30" y="67" font-size="16">Selected topology; production release evidence is incomplete.</text><rect x="30" y="100" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="130" text-anchor="middle" font-size="19" font-weight="700">Browsers: Public / User / Admin</text><text x="450" y="159" text-anchor="middle" font-size="16">HTTPS and same-origin browser API</text><rect x="30" y="220" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="250" text-anchor="middle" font-size="19" font-weight="700">Next.js on Vercel</text><text x="450" y="279" text-anchor="middle" font-size="16">Pages, handlers and domain services</text><rect x="30" y="340" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="235" y="370" text-anchor="middle" font-size="19" font-weight="700">Supabase PostgreSQL</text><text x="235" y="399" text-anchor="middle" font-size="16">Separate development / production</text><rect x="460" y="340" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="665" y="370" text-anchor="middle" font-size="19" font-weight="700">SoC LLM</text><text x="665" y="399" text-anchor="middle" font-size="16">Server adapter; no action tools</text><rect x="30" y="460" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"