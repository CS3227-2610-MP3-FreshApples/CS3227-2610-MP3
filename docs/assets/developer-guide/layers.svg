<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" role="img" aria-labelledby="title desc"><title id="title">Allowed dependency direction</title><desc id="desc">Composition root injects services, repositories and edge adapters.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#486176"/></marker></defs><rect width="900" height="595" rx="16" fill="#f5f8fb"/><g font-family="Arial, sans-serif" fill="#17324d"><text x="30" y="38" font-size="25" font-weight="700">Allowed dependency direction</text><text x="30" y="67" font-size="16">Composition root injects services, repositories and edge adapters.</text><rect x="30" y="100" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="235" y="130" text-anchor="middle" font-size="19" font-weight="700">Server Components</text><text x="235" y="159" text-anchor="middle" font-size="16">Authorized service calls</text><rect x="460" y="100" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="665" y="130" text-anchor="middle" font-size="19" font-weight="700">Client Components</text><text x="665" y="159" text-anchor="middle" font-size="16">HTTP API calls</text><rect x="30" y="220" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="250" text-anchor="middle" font-size="19" font-weight="700">Services / Route Handlers</text><text x="450" y="279" text-anchor="middle" font-size="16">Handlers validate transport; services enforce domain invariants</text><rect x="30" y="340" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="235" y="370" text-anchor="middle" font-size="19" font-weight="700">Repositories</text><text x="235" y="399" text-anchor="middle" font-size="16">Parameterized SQL</text><rect x="460" y="340" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="665" y="370" text-anchor="middle" font-size="19" font-weight="700">Provider interface</text><text x="665" y="399" text-anchor="middle" font-size="16">Replaceable adapter</text><rect x="30" y="460" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="235" y="490" text-anchor="middle" font-size="19" font-weight="700">PostgreSQL</text><text x="235" y="519" text-anchor="middle" font-size="16">Least-privilege runtime role</text><rect x="460" y="460" width="410" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="665" y="490" text-anchor="middle" font-size="19" font-weight="700">SoC LLM</text><text x="665" y="519" text-anchor="middle" font-size="16">Validated derived output only</text><path d="M235 190 L450 216" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M665 190 L450 216" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M450 310 L235 336" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M450 310 L665 336" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M235 430 L235 456" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M665 430 L665 456" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/></g></svg>