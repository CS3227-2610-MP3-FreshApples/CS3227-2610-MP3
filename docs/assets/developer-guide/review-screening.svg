<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" role="img" aria-labelledby="title desc"><title id="title">Review screening and recovery</title><desc id="desc">No database transaction stays open during a provider network call.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#486176"/></marker></defs><rect width="900" height="595" rx="16" fill="#f5f8fb"/><g font-family="Arial, sans-serif" fill="#17324d"><text x="30" y="38" font-size="25" font-weight="700">Review screening and recovery</text><text x="30" y="67" font-size="16">No database transaction stays open during a provider network call.</text><rect x="30" y="100" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="130" text-anchor="middle" font-size="19" font-weight="700">1. Review mutation transaction</text><text x="450" y="159" text-anchor="middle" font-size="16">Save pending text and durable moderation work</text><rect x="30" y="220" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="250" text-anchor="middle" font-size="19" font-weight="700">2. Commit, then attempt bounded screening</text><text x="450" y="279" text-anchor="middle" font-size="16">Complete body, pseudonymous identifiers and versioned policy</text><rect x="30" y="340" width="840" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="370" text-anchor="middle" font-size="19" font-weight="700">3. Validate and conditionally store</text><text x="450" y="399" text-anchor="middle" font-size="16">Schema, exact quotes, lease, row version and content revision</text><rect x="30" y="460" width="266.6666666666667" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="163.33333333333334" y="490" text-anchor="middle" font-size="19" font-weight="700">Clean and current</text><text x="163.33333333333334" y="519" text-anchor="middle" font-size="16">Clear; preserve hide/delete</text><rect x="316.6666666666667" y="460" width="266.6666666666667" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="450" y="490" text-anchor="middle" font-size="19" font-weight="700">Suspected / uncertain</text><text x="450" y="519" text-anchor="middle" font-size="16">Flag for human review</text><rect x="603.3333333333334" y="460" width="266.6666666666667" height="90" rx="10" fill="white" stroke="#aac1d2" stroke-width="2"/><text x="736.6666666666667" y="490" text-anchor="middle" font-size="19" font-weight="700">Unavailable / invalid</text><text x="736.6666666666667" y="519" text-anchor="middle" font-size="16">Hold; recovery or manual</text><path d="M450 190 L450 216" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M450 310 L450 336" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M450 430 L163 456" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M450 430 L450 456" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M450 430 L737 456" stroke="#486176" fill="none" stroke-width="2" marker-end="url(#a)"/></g></svg>