# Release checks (DEP-02, D-18, D-40, D-41). Job names are the required status checks on master.
# No job reads repository secrets or deploy credentials, and no job deploys; every value here is synthetic.
name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps, PageProps and RouteContext are generated into .next/types, which a fresh checkout lacks.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      # Disposable PostgreSQL 17 bound to loopback only (D-10); the password is a synthetic CI value.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # DEP-08 archive round trips need pg_dump/pg_restore >= the PostgreSQL 17 service.
      # Use PostgreSQL's signed apt repository rather than the runner's changing default client.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      # Same disposable loopback PostgreSQL 17 as the integration job (D-10, D-42).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # Chromium only (D-09), at the version the locked @playwright/test expects.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Its own build with the static D-42 values, not the canary build from build-secret-scan. The database
      # URL and secrets are generated per run by npm run test:e2e and are not needed at build time.
      - name: Build
        env:
          APP_ENV: test
          PUBLIC_APP_URL: http://127.0.0.1:3100
          AI_PROVIDER: fake
          AI_ENABLED: "false"
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

  build-secret-scan:
    name: build-secret-scan
    runs-on: ubuntu-latest
    env:
      # Pinned gitleaks release and the SHA-256 from its checksums file (D-41). Changing either needs a
      # reviewed PR that updates D-41.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="${BEFORE_SHA}..${AFTER_SHA}" .

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # Fresh random canaries each run, so no canary is committed for gitleaks to flag. DATABASE_URL and
      # MIGRATION_DATABASE_URL carry theirs in the password (D-41). DATABASE_CA_CERT is public, not a canary.
      - name: Generate canary secrets
        run: |
          canary() { printf 'mp3canary%s%s' "$1" "$(openssl rand -hex 16)"; }
          {
            echo "DATABASE_URL=postgresql://app_runtime:$(canary databaseurl)@127.0.0.1:5432/postgres"
            echo "MIGRATION_DATABASE_URL=postgresql://migrator:$(canary migrationurl)@127.0.0.1:5432/postgres"
            echo "SESSION_SECRET=$(canary sessionsecret)"
            echo "RATE_LIMIT_KEY_SECRET=$(canary ratelimitkey)"
            echo "CRON_SECRET=$(canary cronsecret)"
            echo "SOC_LLM_API_KEY=$(canary socllmapikey)"
            echo "ADMIN_BOOTSTRAP_EMAIL=$(canary bootstrapemail)@example.test"
            echo "ADMIN_BOOTSTRAP_PASSWORD=$(canary bootstrappassword)1!"
            echo "ADMIN_BOOTSTRAP_SECRET=$(canary bootstrapsecret)"
          } >> "$GITHUB_ENV"

      - name: Build with canary secrets
        env:
          APP_ENV: test
          PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Scan built assets
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner .next/static

      - name: Check built assets for canaries
        run: node scripts/check-bundle-canary.mjs

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # Runs `npm audit --json` over all dependencies and checks it against audit-exceptions.json (D-40).
      - name: Audit dependencies
        run: node scripts/check-audit.mjs
