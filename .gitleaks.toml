# gitleaks configuration (D-29, D-41). Used by the CI build-secret-scan job and `npm run check:secrets`.
title = "CS3227-2610-MP3"

[extend]
useDefault = true

# A false positive may be allowed only through a reviewed [[allowlists]] entry
# that carries a justification comment (security.md "Development-process security"). Never allowlist a
# real secret; rotate it instead.

# D-29 / D-41: the cron integration test declares this synthetic placeholder and injects it with
# vi.stubEnv; it is not a deployment credential. Match only this exact value in this exact test file.
# AND is required: neither the path nor the value alone is an exception.
[[allowlists]]
description = "Synthetic cron authentication fixture (DEP-09 integration test)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/integration/api/cron/summary-cron\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^synthetic-cron-secret-0123456789abcdef0123$''']

# D-29 / D-41: DEP-10 also injects this synthetic fixture through vi.stubEnv.
# Human approved this exact-file/exact-value exception in the CI repair session.
[[allowlists]]
description = "Synthetic cron authentication fixture (DEP-10 integration test)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/integration/api/cron/review-moderation-cron\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^synthetic-cron-secret-0123456789abcdef0123$''']
